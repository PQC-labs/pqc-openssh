services:

  server:
    build:
      context: ./server
    image: pqc_lab001-pqc-server:latest
    container_name: pqc_lab001-pqc-server
    hostname: server
    networks:
      - pqc-net
    volumes:
      - ../../docker/keys:/keys:ro
    ports:
      - "2222:22"
    restart: unless-stopped

  client:
    build:
      context: ./client

    image: pqc_lab001-pqc-client:latest
    container_name: pqc_lab001-pqc-client
    hostname: client

    networks:
      - pqc-net

    volumes:
      - ../../docker/keys:/keys:ro

    depends_on:
      - server

    stdin_open: true
    tty: true

    restart: unless-stopped

networks:
  pqc-net:
    driver: bridge
