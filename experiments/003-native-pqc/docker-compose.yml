services:

  server:
    build:
      context: ./server
    container_name: pqc_lab003-openssh-server
 
    image: pqc_lab003-openssh-server:latest
    ports:
      - "2223:22"

    volumes:
      - ../../docker/keys:/keys:ro

    networks:
      - pqc-net

  client:
    build:
      context: ./client
    container_name: pqc_lab003-openssh-client

    image: pqc_lab003-openssh-client:latest
    stdin_open: true
    tty: true

    volumes:
      - ../../docker/keys:/keys:ro

    depends_on:
      - server

    networks:
      - pqc-net

networks:
  pqc-net:
    driver: bridge

